name: Update Games List
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'games.json' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate games.json
        run: |
          node -e '
            const fs = require("fs");
            const games = fs.readdirSync(".", { withFileTypes: true })
              .filter(d => d.isDirectory() && !d.name.startsWith(".") && fs.existsSync(`${d.name}/index.html`))
              .map(d => d.name);
            fs.writeFileSync("games.json", JSON.stringify(games, null, 2));
          '

      - name: Commit games.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add games.json
          git diff --staged --quiet || (git commit -m "Update games.json" && git push)

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게임 로비</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      padding: 48px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { font-size: 1.8rem; margin-bottom: 8px; }
    .subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 36px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 24px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
    }
    .icon { font-size: 2rem; margin-bottom: 12px; }
    .title { font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; word-break: keep-all; }
    .desc { color: #94a3b8; font-size: 0.9rem; }
    .status {
      grid-column: 1 / -1;
      text-align: center;
      color: #94a3b8;
      padding: 40px 20px;
      background: #1e293b;
      border-radius: 14px;
      border: 1px dashed #334155;
    }
  </style>
</head>
<body>
  <h1>🎮 퀴즈 게임 선택</h1>
  <p class="subtitle">플레이할 게임을 선택하세요.</p>
  <div class="grid" id="game-grid">
    <div class="status">게임 목록을 불러오는 중입니다...</div>
  </div>

  <script>
    async function loadGames() {
      const grid = document.getElementById("game-grid");
      try {
        const res = await fetch(`./games.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("목록 파일 없음");
        const folders = await res.json();

        if (!folders.length) {
          grid.innerHTML = `<div class="status">등록된 게임이 아직 없습니다.</div>`;
          return;
        }

        grid.innerHTML = folders.map(name => `
          <a class="card" href="./${encodeURIComponent(name)}/index.html">
            <div class="icon">🎮</div>
            <div class="title">${name}</div>
            <div class="desc">클릭하여 플레이</div>
          </a>
        `).join("");
      } catch (e) {
        grid.innerHTML = `<div class="status">게임 목록을 불러오지 못했습니다.<br>깃허브 배포가 완료된 뒤 다시 새로고침해 주세요.</div>`;
      }
    }

    loadGames();
  </script>
</body>
</html>
